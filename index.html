<title>Parli Aspo — Learn the Language of Hope</title>

<style>
:root {
  --bg: #0F1A1F;
  --bg2: #162229;
  --card: #1C2F38;
  --card-hover: #22394A;
  --green: #58CC02;
  --green-dark: #46A302;
  --green-glow: rgba(88,204,2,0.18);
  --red: #FF4B4B;
  --red-glow: rgba(255,75,75,0.12);
  --gold: #FFC800;
  --gold-glow: rgba(255,200,0,0.15);
  --blue: #1CB0F6;
  --blue-glow: rgba(28,176,246,0.12);
  --purple: #CE82FF;
  --text: #FFFFFF;
  --dim: #7A99A8;
  --mid: #A3BCC9;
  --border: #263A45;
  --input: #0B151B;
  --ok: #1E4A14;
  --bad: #4A1414;
  --radius: 16px;
  --font: 'Nunito', 'Baloo 2', system-ui, sans-serif;
  --display: 'Baloo 2', 'Nunito', system-ui, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:#0F1A1F; }
body { font-family:var(--font); background:#0F1A1F; background:var(--bg); color:#FFFFFF; color:var(--text); min-height:100vh; min-height:100dvh; overflow-x:hidden; }
button { font-family:var(--font); cursor:pointer; border:none; outline:none; color:#FFFFFF; }
input { font-family:var(--font); outline:none; color:#FFFFFF; }

/* Animations */
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes pop { 0%{transform:scale(0.8);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
@keyframes glow { 0%,100%{box-shadow:0 0 20px var(--green-glow)} 50%{box-shadow:0 0 40px var(--green-glow)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes confetti { 0%{transform:translateY(0) rotate(0);opacity:1} 100%{transform:translateY(-200px) rotate(720deg);opacity:0} }
.fade-up { animation: fadeUp 0.4s ease-out both; }
.pop { animation: pop 0.35s ease-out both; }
.shake { animation: shake 0.4s ease-out; }
.float { animation: float 3s ease-in-out infinite; }

/* Screen containers */
.screen { min-height:100vh; min-height:100dvh; background:#0F1A1F; background:var(--bg); color:#FFFFFF; }

/* Progress bar */
.progress-track { width:100%; height:14px; background:var(--input); border-radius:99px; overflow:hidden; }
.progress-fill { height:100%; border-radius:99px; transition:width 0.6s cubic-bezier(.34,1.56,.64,1); }

/* Badges */
.badge { display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:4px 12px; font-size:13px; font-weight:800; }
.badge-xp { background:var(--gold-glow); border:1.5px solid var(--gold); color:var(--gold); }
.badge-streak { background:rgba(255,120,0,0.12); border:1.5px solid #FF7800; color:#FF7800; }
.badge-lessons { background:var(--blue-glow); border:1.5px solid var(--blue); color:var(--blue); }

/* Option buttons */
.opt-btn {
  width:100%; padding:15px 18px; background:var(--card); border:2.5px solid var(--border);
  border-radius:var(--radius); color:var(--text); font-size:16px; font-weight:700;
  text-align:left; transition:all 0.15s; position:relative; overflow:hidden;
}
.opt-btn:active { transform:scale(0.97); }
.opt-btn.correct { background:var(--ok); border-color:var(--green); box-shadow:0 0 24px var(--green-glow); }
.opt-btn.wrong { background:var(--bad); border-color:var(--red); box-shadow:0 0 24px var(--red-glow); }
.opt-btn.faded { opacity:0.35; }

/* Match buttons */
.match-btn {
  padding:12px 14px; border-radius:13px; font-size:14px; font-weight:700;
  border:2.5px solid var(--border); background:var(--card); color:var(--text);
  transition:all 0.15s; text-align:center;
}
.match-btn.selected { background:var(--blue-glow); border-color:var(--blue); }
.match-btn.matched { background:var(--ok); border-color:var(--green); opacity:0.5; }
.match-btn.wrong-match { background:var(--bad); border-color:var(--red); }

/* Word bank */
.word-chip {
  padding:9px 15px; border-radius:11px; font-size:15px; font-weight:700;
  border:2.5px solid var(--border); background:var(--card); color:var(--text);
  transition:all 0.12s;
}
.word-chip:active { transform:scale(0.93); }
.word-chip.placed { background:var(--blue-glow); border-color:var(--blue); }

/* Lesson card */
.lesson-card {
  width:100%; display:flex; align-items:center; gap:14px; padding:14px 16px;
  border:2.5px solid var(--border); border-radius:var(--radius); margin-bottom:10px;
  text-align:left; transition:all 0.15s; background:var(--card);
}
.lesson-card:active { transform:scale(0.98); }
.lesson-card.completed { background:rgba(88,204,2,0.06); border-color:var(--green); }
.lesson-card.locked { opacity:0.35; cursor:default; }
.lesson-icon {
  width:50px; height:50px; border-radius:14px; display:flex; align-items:center;
  justify-content:center; font-size:24px; flex-shrink:0; background:var(--input);
}
.lesson-card.completed .lesson-icon { background:var(--green-glow); border:2px solid var(--green); }

/* Tabs */
.tab-bar { display:flex; border-bottom:1.5px solid var(--border); margin:8px 20px 0; }
.tab-btn {
  flex:1; padding:13px 0; background:none; color:var(--dim); font-size:13px;
  font-weight:800; letter-spacing:0.5px; border-bottom:3px solid transparent;
  transition:all 0.2s;
}
.tab-btn.active { color:var(--green); border-bottom-color:var(--green); }

/* Leaderboard */
.lb-row {
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  background:var(--card); border:1.5px solid var(--border); border-radius:14px;
  margin-bottom:8px;
}
.lb-row.is-me { background:rgba(88,204,2,0.06); border:2px solid var(--green); }

/* Primary button */
.btn-primary {
  width:100%; padding:16px; background:var(--green); border-radius:var(--radius);
  color:#fff; font-size:17px; font-weight:800; letter-spacing:0.3px;
  box-shadow:0 4px 20px var(--green-glow), inset 0 1px 0 rgba(255,255,255,0.15);
  transition:all 0.15s; border:none;
}
.btn-primary:active { transform:scale(0.97); background:var(--green-dark); }
.btn-primary:disabled { background:var(--border); box-shadow:none; cursor:default; }

.btn-secondary {
  width:100%; padding:14px; background:none; border:2px solid var(--border);
  border-radius:var(--radius); color:var(--dim); font-size:15px; font-weight:700;
}

/* Check button (bottom fixed) */
.check-bar {
  position:fixed; bottom:0; left:0; right:0; padding:16px 20px;
  padding-bottom:max(16px, env(safe-area-inset-bottom));
  background:linear-gradient(transparent, var(--bg) 30%);
}

/* Confetti */
.confetti-piece {
  position:fixed; width:10px; height:10px; border-radius:2px;
  animation:confetti 1.2s ease-out forwards; pointer-events:none;
}

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }

/* Pronunciation guide */
.pronun { color:var(--blue); font-size:13px; font-style:italic; font-weight:600; margin-top:2px; }
</style>

// UTILITIES

function shuffle(arr) {
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}
function pick(arr,n){return shuffle(arr).slice(0,n);}

// LOCAL STORAGE
// ═══════════════════════════════════════════════════════════════
function saveLocal(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function loadLocal(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def}}

function getCurrentUsername(){
  return loadLocal("pa_current_user","");
}
function setCurrentUsername(name){
  saveLocal("pa_current_user",name);
}

function loadUserData(username){
  if(!username) return {username:"",xp:0,streak:0,lessonsCompleted:[],lastActiveDate:null};
  const data = loadLocal("pa_user_"+username, {username,xp:0,streak:0,lessonsCompleted:[],lastActiveDate:null});
  data.username = username;
  // Streak check
  if(data.lastActiveDate){
    const today=new Date().toDateString();
    const yesterday=new Date(Date.now()-86400000).toDateString();
    if(data.lastActiveDate!==today && data.lastActiveDate!==yesterday) data.streak=0;
    if(data.lastActiveDate!==today){data.streak=(data.streak||0)+1;data.lastActiveDate=today;saveLocal("pa_user_"+username,data);}
  }
  return data;
}
function saveUserData(data){
  if(!data.username)return;
  saveLocal("pa_user_"+data.username,data);
}

// FIREBASE LEADERBOARD
// ═══════════════════════════════════════════════════════════════
async function pushToLeaderboard(data){
  if(!firebaseReady||!db||!data.username)return;
  try{
    await db.ref("leaderboard/"+data.username.replace(/[.#$\/\[\]]/g,"_")).set({
      name:data.username, xp:data.xp, streak:data.streak, lessons:data.lessonsCompleted.length,
      updatedAt:Date.now()
    });
  }catch(e){console.warn("Firebase push error:",e);}
}
async function fetchLeaderboard(){
  if(!firebaseReady||!db) return [];
  try{
    const snap = await db.ref("leaderboard").orderByChild("xp").limitToLast(50).once("value");
    const entries=[];
    snap.forEach(c=>{entries.push(c.val());});
    return entries.sort((a,b)=>b.xp-a.xp);
  }catch(e){console.warn("Firebase fetch error:",e);return [];}
}

// ═══════════════════════════════════════════════════════════════
// EXERCISE GENERATION
// ═══════════════════════════════════════════════════════════════
function generateExercises(lessonId){
  const lesson=LESSONS.find(l=>l.id===lessonId);
  const vocab=V[lesson.vocabKey];
  const mcExercises=[];
  const matchExercises=[];
  const fillExercises=[];
  const wordOrderExercises=[];

  if(lesson.isSentence){
    vocab.forEach(item=>{
      wordOrderExercises.push({type:"wordOrder",prompt:`Translate: "${item.en}"`,correctOrder:item.pa,shuffled:shuffle([...item.pa])});
    });
    vocab.slice(0,5).forEach(item=>{
      const wrong=pick(vocab.filter(v=>v.en!==item.en),3).map(v=>v.en);
      mcExercises.push({type:"mc",prompt:`What does "${item.pa.join(" ")}" mean?`,correct:item.en,options:shuffle([item.en,...wrong])});
    });
  } else {
    const items=vocab.map(v=>({pa:v.pa,en:v.en,note:v.note,pr:v.pr}));

    // MC: PA -> EN
    items.forEach(item=>{
      const wrong=pick(items.filter(v=>v.en!==item.en),3).map(v=>v.en);
      mcExercises.push({type:"mc",prompt:`What does "${item.pa}" mean?`,correct:item.en,options:shuffle([item.en,...wrong]),note:item.note,pr:item.pr,paWord:item.pa});
    });
    // MC: EN -> PA
    items.slice(0,5).forEach(item=>{
      const wrong=pick(items.filter(v=>v.pa!==item.pa),3).map(v=>v.pa);
      mcExercises.push({type:"mc",prompt:`How do you say "${item.en}" in Parli Aspo?`,correct:item.pa,options:shuffle([item.pa,...wrong])});
    });
    // Matching
    const matchItems=pick(items,4);
    matchExercises.push({type:"match",pairs:matchItems.map(v=>({left:v.pa,right:v.en}))});
    // Mini sentences
    const miniSentences=buildMiniSentences(items,lessonId);
    miniSentences.forEach(s=>wordOrderExercises.push(s));
    // Fill blank LAST
    items.slice(0,3).forEach(item=>{
      fillExercises.push({type:"fill",prompt:`"${item.en}" in Parli Aspo is:`,correct:item.pa.toLowerCase()});
    });
  }

  // ORDER: MC first, matching, word order, fill blank last
  const ordered=[...shuffle(mcExercises).slice(0,5),...matchExercises,...shuffle(wordOrderExercises).slice(0,3),...shuffle(fillExercises).slice(0,2)];
  return ordered.slice(0,12);
}

function buildMiniSentences(items,lessonId){
  const predefined=LS[lessonId];
  if(!predefined||predefined.length===0)return[];
  return pick(predefined,Math.min(2,predefined.length)).map(s=>({type:"wordOrder",prompt:`Translate: "${s.en}"`,correctOrder:s.pa,shuffled:shuffle([...s.pa])}));
}

  const name=val.trim();
  if(!name)return;
  setCurrentUsername(name);

  const user = existing.lastActiveDate ? existing : {
    ...existing,
    username: name,

    lastActiveDate: new Date().toDateString()
  };

  setState({user, screen:"home"});
  fetchLeaderboard().then(lb=>setState({leaderboard:lb}));
}

  const lesson=LESSONS[idx];

    screen:"lesson",lesson,exercises,exIdx:0,correct:0,hearts:3,accXP:0,
    mcSelected:null,mcAnswered:false,
    matchSelectedLeft:null,matchMatched:[],matchWrong:null,
    matchShuffledRight:ex.type==="match"?shuffle(ex.pairs.map(p=>p.right)):[],
    fillInput:"",fillAnswered:false,fillCorrect:false,
    woSelected:[],woAvailable:ex.type==="wordOrder"?[...ex.shuffled]:[],woAnswered:false,woCorrect:false,
    waitingContinue:false,
  });
}

function renderLesson(){
  const ex=state.exercises[state.exIdx];
  const pct=state.exIdx/state.exercises.length*100;
  const heartsHTML=[...Array(3)].map((_,i)=>`<span style="font-size:20px;opacity:${i<state.hearts?1:0.2}">❤️</span>`).join("");

  let exHTML="";
  if(ex.type==="mc") exHTML=renderMC(ex);
  else if(ex.type==="match") exHTML=renderMatch(ex);
  else if(ex.type==="fill") exHTML=renderFill(ex);
  else if(ex.type==="wordOrder") exHTML=renderWordOrder(ex);

  let continueHTML="";
  if(state.waitingContinue){
    continueHTML=`<div class="check-bar"><button id="continueBtn" class="btn-primary" style="background:var(--red);box-shadow:0 4px 20px var(--red-glow)">CONTINUE</button></div>`;

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
        <button id="closeBtn" style="background:none;color:var(--dim);font-size:24px;padding:4px">✕</button>

        <div style="display:flex;gap:2px">${heartsHTML}</div>
      </div>
      <div style="max-width:480px;margin:0 auto" class="fade-up">${exHTML}</div>
    </div>${continueHTML}`;

  document.getElementById("closeBtn").addEventListener("click",()=>setState({screen:"home"}));
  const contBtn=document.getElementById("continueBtn");
  if(contBtn) contBtn.addEventListener("click",()=>advanceAfterAnswer());
  if(ex.type==="mc") bindMC(ex);
  else if(ex.type==="match") bindMatch(ex);
  else if(ex.type==="fill") bindFill(ex);
  else if(ex.type==="wordOrder") bindWordOrder(ex);
}

// Multiple Choice
function renderMC(ex){
  const optsHTML=ex.options.map((opt,i)=>{
    let cls="opt-btn";
    if(state.mcAnswered){
      if(opt===ex.correct) cls+=" correct";
      else if(opt===state.mcSelected&&opt!==ex.correct) cls+=" wrong";
      else if(opt!==ex.correct) cls+=" faded";
    }
    return `<button class="${cls}" data-opt="${i}" style="animation-delay:${i*0.05}s">${opt}</button>`;
  }).join("");

  let noteHTML="";
  if(state.mcAnswered&&ex.note) noteHTML=`<div style="margin-top:14px;color:var(--blue);font-size:13px;font-style:italic;font-weight:600">💡 ${ex.note}</div>`;
  if(state.mcAnswered&&ex.pr) noteHTML+=`<div class="pronun">🔊 ${ex.paWord}: ${ex.pr}</div>`;

  return `<div style="font-size:20px;font-weight:800;margin-bottom:24px;line-height:1.4">${ex.prompt}</div>
    <div style="display:flex;flex-direction:column;gap:10px">${optsHTML}</div>${noteHTML}`;
}
function bindMC(ex){
  if(state.mcAnswered) return;
  document.querySelectorAll(".opt-btn").forEach((btn,i)=>{
    btn.addEventListener("click",()=>{
      if(state.mcAnswered)return;
      const opt=ex.options[i];
      state.mcSelected=opt;
      state.mcAnswered=true;
      render();
      const isCorrect=opt===ex.correct;
      if(isCorrect){
        setTimeout(()=>handleAnswer(true),900);
      } else {
        setTimeout(()=>handleAnswer(false),600);
      }
    });
  });
}

// Matching
function renderMatch(ex){
  const leftHTML=ex.pairs.map((p,i)=>{
    const matched=state.matchMatched.find(m=>m.left===p.left);
    const selected=state.matchSelectedLeft===p.left;
    const wrong=state.matchWrong&&state.matchWrong.left===p.left;
    let cls="match-btn";
    if(matched)cls+=" matched";else if(wrong)cls+=" wrong-match";else if(selected)cls+=" selected";
    return `<button class="${cls}" data-side="left" data-idx="${i}">${p.left}</button>`;
  }).join("");
  const rightHTML=state.matchShuffledRight.map((r,i)=>{
    const matched=state.matchMatched.find(m=>m.right===r);
    const wrong=state.matchWrong&&state.matchWrong.right===r;
    let cls="match-btn";
    if(matched)cls+=" matched";else if(wrong)cls+=" wrong-match";
    return `<button class="${cls}" data-side="right" data-idx="${i}">${r}</button>`;
  }).join("");

  return `<div style="font-size:20px;font-weight:800;margin-bottom:24px">Match the pairs</div>
    <div style="display:flex;gap:12px">
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">${leftHTML}</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">${rightHTML}</div>
    </div>`;
}
function bindMatch(ex){
  document.querySelectorAll("[data-side='left']").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i=parseInt(btn.dataset.idx);
      const left=ex.pairs[i].left;
      if(state.matchMatched.find(m=>m.left===left))return;
      state.matchSelectedLeft=left;
      state.matchWrong=null;
      render();
    });
  });
  document.querySelectorAll("[data-side='right']").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(!state.matchSelectedLeft)return;
      const right=state.matchShuffledRight[parseInt(btn.dataset.idx)];
      if(state.matchMatched.find(m=>m.right===right))return;
      const pair=ex.pairs.find(p=>p.left===state.matchSelectedLeft&&p.right===right);
      if(pair){
        state.matchMatched=[...state.matchMatched,pair];
        state.matchSelectedLeft=null;
        render();
        if(state.matchMatched.length===ex.pairs.length) setTimeout(()=>handleAnswer(true),600);
      } else {
        state.matchWrong={left:state.matchSelectedLeft,right};
        render();
        setTimeout(()=>{state.matchWrong=null;state.matchSelectedLeft=null;render();},700);
      }
    });
  });
}

// Fill in blank
function renderFill(ex){
  let feedbackHTML="";
  if(state.fillAnswered&&!state.fillCorrect){
    feedbackHTML=`<div style="margin-top:16px;font-family:var(--font);font-size:28px;font-weight:800;color:var(--text)">Correct answer: <span style="color:var(--green)">${ex.correct}</span></div>`;
  }
  const borderColor=state.fillAnswered?(state.fillCorrect?"var(--green)":"var(--red)"):"var(--border)";
  const bgColor=state.fillAnswered?(state.fillCorrect?"var(--ok)":"var(--bad)"):"var(--input)";

  return `<div style="font-size:20px;font-weight:800;margin-bottom:24px">${ex.prompt}</div>
    <div style="display:flex;gap:10px">
      <input id="fillInput" type="text" value="${state.fillInput}" placeholder="Type your answer..." autocomplete="off" autocapitalize="off"
        ${state.fillAnswered?'disabled':''}
        style="flex:1;padding:14px 16px;background:${bgColor};border:2.5px solid ${borderColor};border-radius:var(--radius);
        color:var(--text);font-size:16px;font-weight:700">
      ${!state.fillAnswered?'<button id="fillCheck" class="btn-primary" style="width:auto;padding:14px 20px;font-size:15px">CHECK</button>':''}
    </div>${feedbackHTML}`;
}
function bindFill(ex){
  if(state.fillAnswered)return;
  const input=document.getElementById("fillInput");
  const btn=document.getElementById("fillCheck");
  input.focus();
  input.addEventListener("input",e=>{state.fillInput=e.target.value;});
  input.addEventListener("keydown",e=>{if(e.key==="Enter")doFillCheck(ex);});
  if(btn)btn.addEventListener("click",()=>doFillCheck(ex));
}
function doFillCheck(ex){
  if(state.fillAnswered||!state.fillInput.trim())return;
  const correct=state.fillInput.trim().toLowerCase()===ex.correct.toLowerCase();
  state.fillAnswered=true;
  state.fillCorrect=correct;
  render();
  if(correct){
    setTimeout(()=>handleAnswer(true),1200);
  } else {
    setTimeout(()=>handleAnswer(false),600);
  }
}

// Word Order
function renderWordOrder(ex){
  const selectedHTML=state.woSelected.length===0
    ?`<span style="color:var(--dim);font-size:14px;padding:4px">Tap words to build the sentence...</span>`
    :state.woSelected.map((w,i)=>`<button class="word-chip placed" data-rm="${i}">${w}</button>`).join("");

  const availHTML=state.woAvailable.map((w,i)=>`<button class="word-chip" data-add="${i}">${w}</button>`).join("");

  const answerBorder=state.woAnswered?(state.woCorrect?"var(--green)":"var(--red)"):"var(--border)";
  const answerBg=state.woAnswered?(state.woCorrect?"var(--ok)":"var(--bad)"):"var(--input)";

  let checkHTML="";
  if(!state.woAnswered&&state.woSelected.length===ex.correctOrder.length){
    checkHTML=`<button id="woCheck" class="btn-primary" style="margin-top:4px">CHECK</button>`;
  }
  let wrongHTML="";
  if(state.woAnswered&&!state.woCorrect){
    wrongHTML=`<div style="margin-top:12px;font-family:var(--font);font-size:28px;font-weight:800;color:var(--text)">Correct: <span style="color:var(--green)">${ex.correctOrder.join(" ")}</span></div>`;
  }

  return `<div style="font-size:20px;font-weight:800;margin-bottom:20px">${ex.prompt}</div>
    <div style="min-height:52px;padding:10px 14px;background:${answerBg};border:2.5px dashed ${answerBorder};border-radius:var(--radius);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">${selectedHTML}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">${availHTML}</div>
    ${checkHTML}${wrongHTML}`;
}
function bindWordOrder(ex){
  if(state.woAnswered)return;
  document.querySelectorAll("[data-add]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i=parseInt(btn.dataset.add);
      const word=state.woAvailable[i];
      state.woSelected=[...state.woSelected,word];
      state.woAvailable=state.woAvailable.filter((_,j)=>j!==i);
      render();
    });
  });
  document.querySelectorAll("[data-rm]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(state.woAnswered)return;
      const i=parseInt(btn.dataset.rm);
      const word=state.woSelected[i];
      state.woSelected=state.woSelected.filter((_,j)=>j!==i);
      state.woAvailable=[...state.woAvailable,word];
      render();
    });
  });
  const checkBtn=document.getElementById("woCheck");
  if(checkBtn) checkBtn.addEventListener("click",()=>{
    const correct=state.woSelected.every((w,i)=>w===ex.correctOrder[i]);
    state.woAnswered=true;
    state.woCorrect=correct;
    render();
    if(correct){
      setTimeout(()=>handleAnswer(true),1000);
    } else {
      setTimeout(()=>handleAnswer(false),600);
    }
  });
}

// ═══════════════════════════════════════════════════════════════
// ANSWER HANDLER
// ═══════════════════════════════════════════════════════════════
function handleAnswer(correct){
  if(correct){
    state.correct++;
    state.accXP+=state.lesson.xp/state.exercises.length;
    // Correct answers auto-advance
    advanceAfterAnswer();
  } else {
    state.hearts--;
    // Wrong answers: show continue button, don't advance yet
    state.waitingContinue=true;
    render();
  }
}

function advanceAfterAnswer(){
  state.waitingContinue=false;

  if(state.hearts<=0){
    setState({screen:"complete"});
    return;
  }

  if(state.exIdx+1>=state.exercises.length){
    // Lesson complete — save
    const totalXP=Math.round(state.accXP);
    const user={
      ...state.user,
      xp:state.user.xp+totalXP,
      lessonsCompleted:[...new Set([...state.user.lessonsCompleted,state.lesson.id])],
      lastActiveDate:new Date().toDateString()
    };
    saveUserData(user);
    pushToLeaderboard(user);
    state.user=user;
    setState({screen:"complete"});
  } else {
    // Next exercise
    const nextIdx=state.exIdx+1;
    const nextEx=state.exercises[nextIdx];
    setState({
      exIdx:nextIdx,
      mcSelected:null,mcAnswered:false,
      matchSelectedLeft:null,matchMatched:[],matchWrong:null,
      matchShuffledRight:nextEx.type==="match"?shuffle(nextEx.pairs.map(p=>p.right)):[],
      fillInput:"",fillAnswered:false,fillCorrect:false,
      woSelected:[],woAvailable:nextEx.type==="wordOrder"?[...nextEx.shuffled]:[],woAnswered:false,woCorrect:false,
      waitingContinue:false,
    });
  }
}

// ═══════════════════════════════════════════════════════════════
// COMPLETE SCREEN
// ═══════════════════════════════════════════════════════════════
function renderComplete(){
  const passed=state.hearts>0;
  const earnedXP=Math.round(state.accXP);

  // Confetti for passed
  let confettiHTML="";
  if(passed){
    const colors=["#58CC02","#FFC800","#1CB0F6","#CE82FF","#FF4B4B"];
    for(let i=0;i<20;i++){
      const color=colors[i%colors.length];
      const left=Math.random()*100;
      const delay=Math.random()*0.5;
      const size=6+Math.random()*8;
      confettiHTML+=`<div class="confetti-piece" style="left:${left}%;bottom:40%;width:${size}px;height:${size}px;background:${color};animation-delay:${delay}s;border-radius:${Math.random()>0.5?'50%':'2px'}"></div>`;
    }
  }

  app.innerHTML=`
    ${confettiHTML}
    <div class="screen" style="display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="text-align:center;max-width:360px" class="pop">
        <div style="font-size:72px;margin-bottom:16px">${passed?"🎉":"💔"}</div>
        <div style="font-family:var(--display);font-size:28px;font-weight:800;color:${passed?'var(--green)':'var(--red)'};margin-bottom:8px">
          ${passed?"Lesson Complete!":"Out of Hearts!"}
        </div>
        ${passed?`
          <div style="color:var(--mid);font-size:16px;margin-bottom:20px">${state.correct}/${state.exercises.length} correct</div>
          <div style="display:flex;justify-content:center;gap:12px;margin-bottom:28px">
            <span class="badge badge-xp" style="font-size:15px;padding:6px 16px">⚡ +${earnedXP} XP</span>
            <span class="badge badge-streak" style="font-size:15px;padding:6px 16px">🔥 ${state.user.streak}</span>
          </div>
        `:`
          <div style="color:var(--dim);font-size:15px;margin-bottom:28px">No malbravi! Trati otra hapa.<br><span style="font-size:13px;color:var(--mid)">(Don't fear! Try again.)</span></div>
        `}
        <button id="completeBtn" class="btn-primary" style="margin-bottom:10px">${passed?"CONTINUE":"TRY AGAIN"}</button>
        ${!passed?'<button id="backBtn" class="btn-secondary">BACK TO LESSONS</button>':''}
      </div>
    </div>`;

  document.getElementById("completeBtn").addEventListener("click",()=>{
    if(!passed){
      const idx=LESSONS.findIndex(l=>l.id===state.lesson.id);
      startLesson(idx);
    } else {
      setState({screen:"home"});
      fetchLeaderboard().then(lb=>setState({leaderboard:lb}));
    }
  });
  const backBtn=document.getElementById("backBtn");
  if(backBtn) backBtn.addEventListener("click",()=>setState({screen:"home"}));
}

// Initial render
render();
</script>
</body>
</html>
